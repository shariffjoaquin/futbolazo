# Revisa cada semana si hay versiones nuevas o parches de seguridad de las dependencias de npm.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: America/Lima
    open-pull-requests-limit: 5
    groups:
      # Parches y versiones menores en un solo PR; las mayores van por separado.
      menores:
        update-types: [minor, patch]
